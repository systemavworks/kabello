name: Deploy Kabello Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "kabello-web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: kabello-web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow (Bing, Yahoo, DuckDuckGo vía Bing, Yandex)
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "kabello.es",
              "key": "2eaa1705f2cf434998d775f66643f6dc",
              "keyLocation": "https://kabello.es/2eaa1705f2cf434998d775f66643f6dc.txt",
              "urlList": [
                "https://kabello.es/",
                "https://kabello.es/servicios.html",
                "https://kabello.es/catalogo.html",
                "https://kabello.es/contacto.html"
              ]
            }'
